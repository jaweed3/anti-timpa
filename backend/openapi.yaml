openapi: 3.1.0
info:
  title: AntiTimpa API
  description: On-device scam/gambling/phishing detection backend for Android overlay
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /verify:
    post:
      summary: Verify
      operationId: verify_verify_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Verify Get
      operationId: verify_get_verify_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /check-scam:
    post:
      summary: Check Scam
      operationId: check_scam_check_scam_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScamCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScamCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    FlaggedItem:
      properties:
        type:
          type: string
          title: Type
          description: account | phone | url | pattern
        value:
          type: string
          title: Value
        reason:
          type: string
          title: Reason
          description: Bahasa Indonesia explanation for this flag
      type: object
      required:
      - type
      - value
      - reason
      title: FlaggedItem
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ScamCheckRequest:
      properties:
        text:
          type: string
          maxLength: 5000
          minLength: 0
          title: Text
          description: Text to scan for scam/gambling patterns
      type: object
      required:
      - text
      title: ScamCheckRequest
    ScamCheckResponse:
      properties:
        verdict:
          type: string
          title: Verdict
          description: Terindikasi Penipuan | Mencurigakan | Aman
        risk_score:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Risk Score
          description: 0-100 risk score
        flagged_items:
          items:
            $ref: '#/components/schemas/FlaggedItem'
          type: array
          title: Flagged Items
          description: All flagged items found
        explanation:
          type: string
          title: Explanation
          description: Human-readable explanation in Bahasa Indonesia
        sources:
          items:
            type: string
          type: array
          title: Sources
          description: Source references for flagged items
        should_blur:
          type: boolean
          title: Should Blur
          description: True if content should be blurred
      type: object
      required:
      - verdict
      - risk_score
      - flagged_items
      - explanation
      - sources
      - should_blur
      title: ScamCheckResponse
    Source:
      properties:
        title:
          type: string
          title: Title
        url:
          type: string
          title: Url
        snippet:
          type: string
          title: Snippet
      type: object
      required:
      - title
      - url
      - snippet
      title: Source
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerificationRequest:
      properties:
        text:
          type: string
          maxLength: 5000
          minLength: 5
          title: Text
          description: Claim text to verify
          examples:
          - Vaksin mRNA bisa mengubah DNA manusia
        language:
          type: string
          title: Language
          description: Language code
          default: en
          examples:
          - id
      type: object
      required:
      - text
      title: VerificationRequest
    VerificationResponse:
      properties:
        claim:
          type: string
          title: Claim
        verdict:
          type: string
          title: Verdict
          description: Supported | Contradicted | Misleading | Mixed | Insufficient
            Evidence
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        explanation:
          type: string
          title: Explanation
        sources:
          items:
            $ref: '#/components/schemas/Source'
          type: array
          title: Sources
      type: object
      required:
      - claim
      - verdict
      - confidence
      - explanation
      - sources
      title: VerificationResponse
