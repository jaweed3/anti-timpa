[project]
name = "antitimpa-backend"
version = "1.0.0"
description = "AntiTimpa — on-device scam/gambling/phishing detection backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "lxml>=5.1.0",
    "beautifulsoup4>=4.12.0",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
