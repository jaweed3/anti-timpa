[project]
name = "factlens-backend"
version = "1.0.0"
description = "AI-powered fact verification backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "lxml>=5.1.0",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools]
py-modules = [
    "config",
    "main",
    "llm_client",
    "models",
    "search_engine",
    "verification_pipeline",
    "claim_detector",
    "ranker",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
